name: Financial metric and precision verification
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: financial_test
          POSTGRES_USER: financial
          POSTGRES_PASSWORD: test_password
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U financial -d financial_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      FINANCIAL_TEST_DATABASE_URL: postgresql://financial:test_password@localhost:5432/financial_test
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -e '.[dev,evaluation]'
      - run: python -m pytest -q tests/test_financial_metrics.py tests/test_financial_precision_db.py tests/test_financial_rebuild_db.py
