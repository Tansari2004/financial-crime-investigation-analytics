name: Financial crime model

on:
  push:
    paths:
      - '.github/workflows/financial-crime.yml'
      - 'src/financial_crime/**'
      - 'sql/**'
      - 'tests/test_financial_crime*'
      - 'scripts/build_dashboard_data.py'
      - 'pyproject.toml'
  pull_request:
    paths:
      - '.github/workflows/financial-crime.yml'
      - 'src/financial_crime/**'
      - 'sql/**'
      - 'tests/test_financial_crime*'
      - 'scripts/build_dashboard_data.py'
      - 'pyproject.toml'

jobs:
  model-and-sql:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: financial_crime_test
          POSTGRES_USER: crime_test
          POSTGRES_PASSWORD: test_only
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U crime_test -d financial_crime_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      FINANCIAL_CRIME_TEST_DATABASE_URL: postgresql://crime_test:test_only@localhost:5432/financial_crime_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install model and test dependencies
        run: python -m pip install -e '.[dev]'
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Check metrics, history windows, atomic loads and explained-score reconstruction
        run: python -m pytest -q tests/test_financial_crime*.py
