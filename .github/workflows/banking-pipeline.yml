name: Banking pipeline

on:
  push:
    paths:
      - ".github/workflows/banking-pipeline.yml"
      - "compose.yaml"
      - ".dockerignore"
      - "docker/pipeline.Dockerfile"
      - "pipeline/**"
      - "src/banking_pipeline/**"
      - "tests/test_banking_*"
      - "tests/fixtures/*pipeline*"
      - "scripts/verify_banking_full_run.py"
      - "pyproject.toml"
  pull_request:
    paths:
      - ".github/workflows/banking-pipeline.yml"
      - "compose.yaml"
      - ".dockerignore"
      - "docker/pipeline.Dockerfile"
      - "pipeline/**"
      - "src/banking_pipeline/**"
      - "tests/test_banking_*"
      - "tests/fixtures/*pipeline*"
      - "scripts/verify_banking_full_run.py"
      - "pyproject.toml"

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: banking_test
          POSTGRES_USER: banking
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U banking -d banking_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      BANKING_TEST_DATABASE_URL: postgresql://banking:test_password@localhost:5432/banking_test
      BANKING_POSTGRES_HOST: localhost
      BANKING_POSTGRES_PORT: "5432"
      BANKING_POSTGRES_USER: banking
      BANKING_POSTGRES_PASSWORD: test_password
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install test and orchestration dependencies
        run: python -m pip install -e ".[dev,orchestration,dbt]"
      - name: Python tests, including live PostgreSQL and Dagster
        run: python -m pytest -q tests/test_banking_pipeline.py tests/test_banking_pipeline_db.py tests/test_banking_model_db.py tests/test_banking_analytics_db.py tests/test_banking_dagster_db.py tests/test_banking_precision_db.py
      - name: Prepare clean published fixture for independent dbt checks
        env:
          BANKING_DBT_DATABASE_URL: postgresql://banking:test_password@localhost:5432/banking_dbt
        run: |
          python -c 'import psycopg; psycopg.connect("postgresql://banking:test_password@localhost:5432/banking_test", autocommit=True).execute("CREATE DATABASE banking_dbt")'
          python -m banking_pipeline.bootstrap --dsn "$BANKING_DBT_DATABASE_URL"
          python -m banking_pipeline.ingest tests/fixtures/clean_pipeline_Trans.csv --dsn "$BANKING_DBT_DATABASE_URL"
          python -m banking_pipeline.promote --all --dsn "$BANKING_DBT_DATABASE_URL"
          python -m banking_pipeline.analytics --dsn "$BANKING_DBT_DATABASE_URL"
          python scripts/verify_banking_full_run.py --dsn "$BANKING_DBT_DATABASE_URL" --min-source-rows 5
      - name: Independent dbt quality checks
        env:
          BANKING_POSTGRES_DB: banking_dbt
        run: dbt test --project-dir pipeline/dbt --profiles-dir pipeline/dbt

  compose-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Validate and start the container stack
        run: |
          docker compose config --quiet
          docker compose up -d --build
      - name: Exercise the packaged pipeline against Compose PostgreSQL
        run: |
          docker compose cp tests/fixtures/clean_pipeline_Trans.csv dagster:/tmp/smoke_Trans.csv
          docker compose exec -T dagster python -m banking_pipeline.ingest /tmp/smoke_Trans.csv
          docker compose exec -T dagster python -m banking_pipeline.promote --all
          docker compose exec -T dagster python -m banking_pipeline.analytics
          docker compose exec -T dagster python scripts/verify_banking_full_run.py --min-source-rows 5
          docker compose exec -T dagster python -c 'import os, psycopg; c=psycopg.connect(os.environ["BANKING_DATABASE_URL"]); assert c.execute("SELECT sum(transaction_count) FROM analytics.fact_daily_transaction").fetchone()[0] == 5; c.close()'
          docker compose exec -T dagster python -c 'from banking_pipeline.orchestration import defs; assert defs.resolve_job_def("banking_daily_pipeline")'
      - name: Show container logs on failure
        if: failure()
        run: docker compose logs --no-color --tail=200
      - name: Remove CI containers and volumes
        if: always()
        run: docker compose down -v
