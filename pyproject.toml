[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "financial-crime-investigation"
version = "0.1.0"
description = "PostgreSQL investigation analytics for synthetic financial transactions."
requires-python = ">=3.10"
dependencies = [
  "pandas>=2.2,<3",
  "pyarrow>=15,<20",
  "tabulate>=0.9,<1",
  "psycopg[binary]>=3.2,<4",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]
orchestration = ["dagster>=1.12,<2", "dagster-webserver>=1.12,<2"]
dbt = ["dbt-postgres>=1.10,<2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
